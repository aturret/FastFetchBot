name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: fastfetchbot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      skip: ${{ steps.check_message.outputs.skip }}
      docker_tag: ${{ steps.env_vars.outputs.docker_tag }}
      version_tag: ${{ steps.env_vars.outputs.version_tag }}
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            image_suffix: api
          - service: telegram-bot
            dockerfile: apps/telegram-bot/Dockerfile
            image_suffix: tgbot
          - service: worker
            dockerfile: apps/worker/Dockerfile
            image_suffix: worker
          - service: async-worker
            dockerfile: apps/async-worker/Dockerfile
            image_suffix: async-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message
        id: check_message
        run: |
          MESSAGE=$(git log --format=%B -n 1 "$GITHUB_SHA")
          if [[ "$MESSAGE" == *"[github-action]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Environment Tags
        id: env_vars
        run: |
          # Check if the workflow was triggered by a tag or a branch push
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Production Environment (Tag Trigger)
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            echo "docker_tag=latest" >> "$GITHUB_OUTPUT"
            echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          else
            # Staging Environment (Main Branch Trigger)
            echo "docker_tag=stage" >> "$GITHUB_OUTPUT"
            # Use the short commit SHA as a secondary tag for tracking
            echo "version_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate App Version
        run: echo "APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Build and push
        if: steps.check_message.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64/v8
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fastfetchbot-${{ matrix.image_suffix }}:${{ steps.env_vars.outputs.docker_tag }}
            ghcr.io/${{ github.repository_owner }}/fastfetchbot-${{ matrix.image_suffix }}:${{ steps.env_vars.outputs.version_tag }}

  notify:
    name: Telegram Notification
    needs: build
    # Run after all matrix builds finish, whether they passed or failed.
    # Skip when the build was cancelled or skipped via the [github-action] marker.
    if: ${{ always() && needs.build.result != 'cancelled' && needs.build.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Prepare commit message
        id: commit_msg
        env:
          # Passed via env (not inline ${{ }}) to avoid shell injection from commit messages
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG=$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          echo "first_line=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Telegram Notification on Success
        uses: appleboy/telegram-action@847a2d3240d33a6137191cc89b3ad7f53e427c06  # master
        if: ${{ needs.build.result == 'success' }}
        with:
          to: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ✅ <b>Docker Images Published Successfully</b>

            📦 Images: <code>fastfetchbot-{api,tgbot,worker,async-worker}</code>
            🏷️ Tags: <code>${{ needs.build.outputs.docker_tag }}</code>, <code>${{ needs.build.outputs.version_tag }}</code>
            🕐 Timestamp: <code>${{ github.event.head_commit.timestamp }}</code>

            📝 Commit: <code>${{ github.sha }}</code>
            Message: ${{ steps.commit_msg.outputs.first_line }}
            Author: <code>${{ github.actor }}</code>
            Ref: <code>${{ github.ref_name }}</code>

            🔗 <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow</a>
            🔗 <a href="https://github.com/${{ github.repository_owner }}?tab=packages&amp;repo_name=${{ github.event.repository.name }}">View Images</a>

      - name: Telegram Notification on Failure
        uses: appleboy/telegram-action@847a2d3240d33a6137191cc89b3ad7f53e427c06  # master
        if: ${{ needs.build.result == 'failure' }}
        with:
          to: ${{ secrets.TELEGRAM_DEBUG_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ❌ <b>GitHub Actions Failed</b> Repo: <code>${{ github.repository }}</code>
            Ref: <code>${{ github.ref_name }}</code>
            Author: <code>${{ github.actor }}</code>
            Message: ${{ steps.commit_msg.outputs.first_line }}
            Details: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a>

            <b>Job: build failed!</b>

